# Lightbar — Mosquitto broker configuration
# Version: 2.0.0
# The password and ACL files are generated from .env by entrypoint.sh.

listener 1883
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
